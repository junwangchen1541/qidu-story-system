name: Bug report
description: Report a reproducible problem in the public demo or shared code.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Identify the affected screen or event, platform, version, and expected behavior. Content reports should include the route and event IDs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.3.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, or WeChat DevTools version
    validations:
      required: true
